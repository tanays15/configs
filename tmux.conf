# Prefix key: Ctrl+Space instead of Ctrl+b
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Windows start at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Give the session name room so it doesn't get truncated, and
# add a gap before the window list
set -g status-left-length 40
set -g status-left "[#S]  "

# Mouse support: click to select panes/windows, drag to resize, and scroll
# wheel scrolls the pane's history instead of falling through as up/down
# arrow keys (which readline reads as prev/next shell history)
set -g mouse on

# Move current window left/right with prefix + < / >
bind-key -r "<" swap-window -t -1
bind-key -r ">" swap-window -t +1

# New windows/panes open in the current pane's working directory
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Ghostty supports extended key reporting (Ctrl vs Ctrl+Shift on the same
# letter), but tmux's built-in terminal database doesn't know that yet
set -as terminal-features 'xterm-ghostty:extkeys'
set -s extended-keys on

# 24-bit (truecolor) support
set -as terminal-features 'xterm-ghostty:RGB'

# Fuzzy-find and switch sessions in a popup (prefix + s, overriding the default
# choose-tree). `cut -d: -f1` rather than -F '#{session_name}' because tmux
# expands #{...} in the popup command string before the shell ever sees it.
bind-key s display-popup -E -w 60% -h 60% \
    "tmux list-sessions | cut -d: -f1 | fzf --reverse --prompt 'session> ' | xargs -r tmux switch-client -t"

# Fuzzy-find a project directory and switch to (or create) its session.
# Absolute path because ~/.local/bin is not on PATH in the popup's shell.
bind-key f display-popup -E -w 60% -h 60% "$HOME/.local/bin/tmux-sessionizer"

# Cycle windows without the prefix key
bind-key -n C-S-p previous-window
bind-key -n C-S-n next-window

# Vim-style copy mode: v to select, y to yank (and exit copy mode, like vim)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Persist and auto-restore tmux sessions across restarts/reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

